<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tasks-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080d17" />
    <title>Hybrid DC Microgrid & P2H2P Simulation Workbench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              mono: ['"JetBrains Mono"', 'monospace'],
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      html, body {
        font-family: 'Inter', sans-serif;
        color: #f1f5f9;
        background-color: #080d17;
        margin: 0;
        padding: 0;
        min-height: 100%;
        width: 100%;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: contain;
      }

      /* Natural smooth scrolling on mobile/tablet */
      body {
        overflow-y: auto;
        overflow-x: hidden;
      }

      /* Desktop high-density workstation locked view */
      @media (min-width: 1024px) {
        body {
          overflow: hidden;
          height: 100vh;
        }
      }
      
      /* Disable spin buttons and appearance quirks on all numeric inputs */
      input[type=number] {
        -moz-appearance: textfield;
        appearance: textfield;
      }
      input[type=number]::-webkit-inner-spin-button,
      input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* Custom dense dark scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0f1b;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }

      /* Directional Vector Flow Animations */
      @keyframes flowDashForward {
        from {
          stroke-dashoffset: 24;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes flowDashReverse {
        from {
          stroke-dashoffset: 0;
        }
        to {
          stroke-dashoffset: 24;
        }
      }
      @keyframes dataPacketPulse {
        0%, 100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      .flow-active-forward {
        stroke-dasharray: 6 3;
        animation: flowDashForward 0.85s linear infinite;
      }
      .flow-active-reverse {
        stroke-dasharray: 6 3;
        animation: flowDashReverse 0.85s linear infinite;
      }
      .flow-active-fluid {
        stroke-dasharray: 8 4;
        animation: flowDashForward 1.2s linear infinite;
      }
      .flow-active-data {
        stroke-dasharray: 4 4;
        animation: flowDashForward 0.65s linear infinite;
      }
    </style>
  </head>
  <body class="bg-[#080d17] text-slate-100">
    <div id="root" class="min-h-screen lg:h-screen w-full overflow-x-hidden lg:overflow-hidden"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
